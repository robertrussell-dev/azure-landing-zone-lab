<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1196 616" width="1196" height="616" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .card   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; rx: 6; }
    .state  { fill: #ffffff; stroke: #8c959f; stroke-width: 1.3; rx: 4; }
    .prov   { fill: #eef4fb; stroke: #a8c7ea; stroke-width: 1; rx: 3; }
    .alias  { fill: #ddf4e4; stroke: #1a7f37; stroke-width: 1.2; rx: 3; }
    .estate { fill: #fff8e6; stroke: #e0c05c; stroke-width: 1; rx: 6; }
    .sub    { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; rx: 4; }
    .title  { fill: #1b1f23; font-size: 15px; font-weight: 700; }
    .cap    { fill: #57606a; font-size: 11px; }
    .dir    { fill: #1b1f23; font-size: 9.5px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sthead { fill: #1b1f23; font-size: 10px; font-weight: 700; }
    .stf    { fill: #57606a; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hd     { fill: #57606a; font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px; }
    .pv     { fill: #1b1f23; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pvn    { fill: #57606a; font-size: 9px; }
    .mk     { fill: #1b1f23; font-size: 9.5px; }
    .estl   { fill: #1b1f23; font-size: 12px; font-weight: 600; }
    .estn   { fill: #57606a; font-size: 10px; }
    .nox    { fill: #cf222e; font-size: 15px; font-weight: 700; }
    .noxl   { fill: #cf222e; font-size: 9.5px; font-weight: 700; }
    .flow   { stroke: #8c959f; stroke-width: 1.4; fill: none; }
    .look   { stroke: #8c959f; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
    .note   { fill: #57606a; font-size: 10.5px; }
    .bg     { fill: #ffffff; }
    .mkf    { fill: #8c959f; }

    /* Readable on a dark page. GitHub renders this from the reader's
       browser setting, so the diagram follows the surrounding theme. */
    @media (prefers-color-scheme: dark) {
      .card   { fill: #262e3a; stroke: #3d4653; stroke-width: 1; rx: 6; }
      .state  { fill: #232a35; stroke: #808b98; stroke-width: 1.3; rx: 4; }
      .prov   { fill: #1a2b3d; stroke: #5288bd; stroke-width: 1; rx: 3; }
      .alias  { fill: #14321f; stroke: #46c464; stroke-width: 1.2; rx: 3; }
      .estate { fill: #2f2917; stroke: #907a33; stroke-width: 1; rx: 6; }
      .sub    { fill: #232a35; stroke: #3d4653; stroke-width: 1; rx: 4; }
      .title  { fill: #e8eef4; font-size: 15px; font-weight: 700; }
      .cap    { fill: #a7b1bd; font-size: 11px; }
      .dir    { fill: #e8eef4; font-size: 9.5px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sthead { fill: #e8eef4; font-size: 10px; font-weight: 700; }
      .stf    { fill: #a7b1bd; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hd     { fill: #a7b1bd; font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px; }
      .pv     { fill: #e8eef4; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .pvn    { fill: #a7b1bd; font-size: 9px; }
      .mk     { fill: #e8eef4; font-size: 9.5px; }
      .estl   { fill: #e8eef4; font-size: 12px; font-weight: 600; }
      .estn   { fill: #a7b1bd; font-size: 10px; }
      .nox    { fill: #ff8a80; font-size: 15px; font-weight: 700; }
      .noxl   { fill: #ff8a80; font-size: 9.5px; font-weight: 700; }
      .flow   { stroke: #808b98; stroke-width: 1.4; fill: none; }
      .look   { stroke: #808b98; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
      .note   { fill: #a7b1bd; font-size: 10.5px; }
      .bg     { fill: #1b212b; }
      .mkf    { fill: #808b98; }
    }
  </style>

  <defs>
    <marker id="a3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" class="mkf"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1196" height="616"/>

  <text class="title" x="20" y="26">Terraform state and provider boundaries</text>
  <text class="cap" x="20" y="44">Six roots, six state files, and no arrows between them: no root reads another's state.</text>

  <!-- ===== root 1 ===== -->
  <rect class="card" x="20" y="62" width="176" height="212"/>
  <text class="dir" x="32" y="82">00-management-groups</text>
  <rect class="state" x="32" y="92" width="152" height="34"/>
  <text class="sthead" x="42" y="107">STATE</text>
  <text class="stf" x="42" y="120">terraform.tfstate, local</text>
  <text class="hd" x="32" y="146">PROVIDERS</text>
  <rect class="prov" x="32" y="152" width="152" height="30"/>
  <text class="pv" x="42" y="166">azurerm (default)</text>
  <text class="pvn" x="42" y="177">pinned, creates nothing</text>
  <rect class="prov" x="32" y="186" width="152" height="18"/>
  <text class="pv" x="42" y="198">azapi</text>
  <text class="hd" x="32" y="222">CREATES</text>
  <text class="mk" x="32" y="237">13 management groups</text>
  <text class="pvn" x="32" y="250">at tenant scope</text>
  <text class="mk" x="32" y="265">+ tenant settings, a role</text>

  <!-- ===== root 2 ===== -->
  <rect class="card" x="216" y="62" width="176" height="212"/>
  <text class="dir" x="228" y="82">10-policy</text>
  <rect class="state" x="228" y="92" width="152" height="34"/>
  <text class="sthead" x="238" y="107">STATE</text>
  <text class="stf" x="238" y="120">terraform.tfstate, local</text>
  <text class="hd" x="228" y="146">PROVIDERS</text>
  <rect class="prov" x="228" y="152" width="152" height="30"/>
  <text class="pv" x="238" y="166">azurerm (default)</text>
  <text class="pvn" x="238" y="177">pinned, creates nothing</text>
  <text class="hd" x="228" y="204">CREATES</text>
  <text class="mk" x="228" y="220">8 policy assignments</text>
  <text class="pvn" x="228" y="234">+ managed identity roles</text>

  <!-- ===== root 3 ===== -->
  <rect class="card" x="412" y="62" width="176" height="212"/>
  <text class="dir" x="424" y="82">20-subscription-placement</text>
  <rect class="state" x="424" y="92" width="152" height="34"/>
  <text class="sthead" x="434" y="107">STATE</text>
  <text class="stf" x="434" y="120">terraform.tfstate, local</text>
  <text class="hd" x="424" y="146">PROVIDERS</text>
  <rect class="prov" x="424" y="152" width="152" height="18"/>
  <text class="pv" x="434" y="164">azurerm (default)</text>
  <rect class="prov" x="424" y="173" width="152" height="18"/>
  <text class="pv" x="434" y="185">azapi</text>
  <rect class="alias" x="424" y="194" width="152" height="26"/>
  <text class="pv" x="434" y="206">azurerm.management</text>
  <text class="pvn" x="434" y="216">alias, management sub</text>
  <text class="hd" x="424" y="236">CREATES</text>
  <text class="mk" x="424" y="251">aliases, placement, budgets,</text>
  <text class="mk" x="424" y="265">baseline, workspace + lock</text>

  <!-- ===== root 4 ===== -->
  <rect class="card" x="608" y="62" width="176" height="212"/>
  <text class="dir" x="620" y="82">25-brownfield-seed</text>
  <rect class="state" x="620" y="92" width="152" height="34"/>
  <text class="sthead" x="630" y="107">STATE</text>
  <text class="stf" x="630" y="120">terraform.tfstate, local</text>
  <text class="hd" x="620" y="146">PROVIDERS</text>
  <rect class="prov" x="620" y="152" width="152" height="18"/>
  <text class="pv" x="630" y="164">azurerm (default)</text>
  <rect class="alias" x="620" y="173" width="152" height="26"/>
  <text class="pv" x="630" y="185">azurerm.brownfield</text>
  <text class="pvn" x="630" y="195">alias, adopted sub</text>
  <text class="hd" x="620" y="218">CREATES</text>
  <text class="mk" x="620" y="233">vnet + subnet,</text>
  <text class="mk" x="620" y="247">deliberately non compliant</text>

  <!-- ===== root 5 ===== -->
  <rect class="card" x="804" y="62" width="176" height="212"/>
  <text class="dir" x="816" y="82">30-auto-delete</text>
  <rect class="state" x="816" y="92" width="152" height="34"/>
  <text class="sthead" x="826" y="107">STATE</text>
  <text class="stf" x="826" y="120">terraform.tfstate, local</text>
  <text class="hd" x="816" y="146">PROVIDERS</text>
  <rect class="prov" x="816" y="152" width="152" height="18"/>
  <text class="pv" x="826" y="164">azurerm (default)</text>
  <rect class="alias" x="816" y="173" width="152" height="26"/>
  <text class="pv" x="826" y="185">azurerm.management</text>
  <text class="pvn" x="826" y="195">alias, management sub</text>
  <text class="hd" x="816" y="218">CREATES</text>
  <text class="mk" x="816" y="233">Automation account, runbook,</text>
  <text class="mk" x="816" y="247">schedule, janitor role</text>

  <!-- ===== root 6 ===== -->
  <rect class="card" x="1000" y="62" width="176" height="212"/>
  <text class="dir" x="1012" y="82">90-optional-network</text>
  <rect class="state" x="1012" y="92" width="152" height="34"/>
  <text class="sthead" x="1022" y="107">STATE</text>
  <text class="stf" x="1022" y="120">terraform.tfstate, local</text>
  <text class="hd" x="1012" y="146">PROVIDERS</text>
  <rect class="prov" x="1012" y="152" width="152" height="18"/>
  <text class="pv" x="1022" y="164">azurerm (default)</text>
  <rect class="alias" x="1012" y="173" width="152" height="26"/>
  <text class="pv" x="1022" y="185">azurerm.connectivity</text>
  <text class="pvn" x="1022" y="195">alias, connectivity sub</text>
  <text class="hd" x="1012" y="218">CREATES</text>
  <text class="mk" x="1012" y="233">hub, 2 spokes, peerings,</text>
  <text class="mk" x="1012" y="247">appliances behind flags</text>

  <!-- ===== the absent coupling ===== -->
  <text class="nox" x="199" y="118">&#215;</text>
  <text class="nox" x="395" y="118">&#215;</text>
  <text class="nox" x="591" y="118">&#215;</text>
  <text class="nox" x="787" y="118">&#215;</text>
  <text class="nox" x="983" y="118">&#215;</text>
  <text class="noxl" x="598" y="296" text-anchor="middle">no remote backend, no state shared, no terraform_remote_state anywhere</text>

  <!-- Arrow kind per root is exact: 00, 25 and 90 declare no data sources at all,
       10 and 20 declare five management group lookups each, and 30 declares one. -->
  <path class="flow" d="M 108 308 L 108 338" marker-end="url(#a3)"/>
  <path class="look" d="M 304 308 L 304 338" marker-end="url(#a3)"/>
  <path class="look" d="M 480 308 L 480 338" marker-end="url(#a3)"/>
  <path class="flow" d="M 520 308 L 520 338" marker-end="url(#a3)"/>
  <path class="flow" d="M 696 308 L 696 338" marker-end="url(#a3)"/>
  <path class="look" d="M 872 308 L 872 338" marker-end="url(#a3)"/>
  <path class="flow" d="M 912 308 L 912 338" marker-end="url(#a3)"/>
  <path class="flow" d="M 1088 308 L 1088 338" marker-end="url(#a3)"/>

  <!-- ===== the estate ===== -->
  <rect class="estate" x="20" y="342" width="1156" height="126"/>
  <text class="estl" x="34" y="366">The Azure estate, addressed by name</text>
  <text class="estn" x="34" y="384">Every root that needs a management group looks it up with a data source, deriving the name from var.prefix. None of them reads another root's state,</text>
  <text class="estn" x="34" y="400">so the six directories can be applied independently and in any order once the hierarchy exists. 30 and 90 take their subscription IDs as variables.</text>

  <rect class="sub" x="34" y="414" width="212" height="40"/>
  <text class="mk" x="44" y="430">management group hierarchy</text>
  <text class="pvn" x="44" y="445">azurerm_management_group, by name</text>

  <rect class="sub" x="263" y="414" width="212" height="40"/>
  <text class="mk" x="273" y="430">DemoSubscription</text>
  <text class="pvn" x="273" y="445">adopted, under Corp (audit only)</text>

  <rect class="sub" x="492" y="414" width="212" height="40"/>
  <text class="mk" x="502" y="430">sub-management</text>
  <text class="pvn" x="502" y="445">vended, holds the workspace and the janitor</text>

  <rect class="sub" x="721" y="414" width="212" height="40"/>
  <text class="mk" x="731" y="430">sub-online-portal-prod</text>
  <text class="pvn" x="731" y="445">vended, placed under Online</text>

  <rect class="sub" x="950" y="414" width="212" height="40"/>
  <text class="mk" x="960" y="430">sub-connectivity</text>
  <text class="pvn" x="960" y="445">vended, holds the hub</text>

  <!-- ===== notes ===== -->
  <text class="note" x="20" y="496">The cost of this shape is the one the README owns: local state is fine for one person and not fine for a team. A second operator, or a pipeline, needs a shared</text>
  <text class="note" x="20" y="512">backend with locking before anything here is safe to run twice at once. Nothing in the design would have to change, only where the six state files live.</text>
  <text class="note" x="20" y="536">The aliased providers are a safety measure. The default provider is pinned to the operator's own subscription and</text>
  <text class="note" x="20" y="552">creates nothing, so a resource that forgot its provider argument fails or lands somewhere obvious, not in the wrong subscription.</text>
  <text class="cap" x="20" y="578">Solid arrow: creates the resource. Dashed arrow: resolves it by name at plan time, reading nothing but Azure.</text>
</svg>
