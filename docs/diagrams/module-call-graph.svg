<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 996" width="1000" height="996" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; rx: 6; }
    .root  { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; rx: 4; }
    .mod   { fill: #eef4fb; stroke: #a8c7ea; stroke-width: 1.4; rx: 4; }
    .shim  { fill: #fff8e6; stroke: #e0c05c; stroke-width: 1.2; stroke-dasharray: 5 3; rx: 4; }
    .title { fill: #1b1f23; font-size: 15px; font-weight: 700; }
    .cap   { fill: #57606a; font-size: 11px; }
    .ph    { fill: #1b1f23; font-size: 12.5px; font-weight: 700; }
    .phs   { fill: #57606a; font-size: 10px; }
    .nm    { fill: #1b1f23; font-size: 10px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ns    { fill: #57606a; font-size: 9px; }
    .edge  { stroke: #8c959f; stroke-width: 1.4; fill: none; }
    .el    { fill: #1a7f37; font-size: 9px; font-weight: 700; }
    .note  { fill: #57606a; font-size: 10.5px; }
    .key   { fill: #1b1f23; font-size: 10px; font-weight: 600; }
    .bg     { fill: #ffffff; }
    .mkf    { fill: #8c959f; }

    /* Readable on a dark page. GitHub renders this from the reader's
       browser setting, so the diagram follows the surrounding theme. */
    @media (prefers-color-scheme: dark) {
      .panel  { fill: #232a35; stroke: #3d4653; stroke-width: 1; rx: 6; }
      .root   { fill: #262e3a; stroke: #808b98; stroke-width: 1.2; rx: 4; }
      .mod    { fill: #1a2b3d; stroke: #5288bd; stroke-width: 1.4; rx: 4; }
      .shim   { fill: #2f2917; stroke: #907a33; stroke-width: 1.2; stroke-dasharray: 5 3; rx: 4; }
      .title  { fill: #e8eef4; font-size: 15px; font-weight: 700; }
      .cap    { fill: #a7b1bd; font-size: 11px; }
      .ph     { fill: #e8eef4; font-size: 12.5px; font-weight: 700; }
      .phs    { fill: #a7b1bd; font-size: 10px; }
      .nm     { fill: #e8eef4; font-size: 10px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ns     { fill: #a7b1bd; font-size: 9px; }
      .edge   { stroke: #808b98; stroke-width: 1.4; fill: none; }
      .el     { fill: #46c464; font-size: 9px; font-weight: 700; }
      .note   { fill: #a7b1bd; font-size: 10.5px; }
      .key    { fill: #e8eef4; font-size: 10px; font-weight: 600; }
      .bg     { fill: #1b212b; }
      .mkf    { fill: #808b98; }
    }
  </style>
  <defs>
    <marker id="a4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" class="mkf"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="996"/>

  <text class="title" x="20" y="26">Module call graph, both implementations</text>
  <text class="cap" x="20" y="44">Roots on the left, what they call to the right. Counted from source, not memory: five call sites into policy-assignment, three budget callers in Terraform, two in Bicep.</text>

  <!-- ================= TERRAFORM ================= -->
  <rect class="panel" x="20" y="60" width="960" height="372"/>
  <text class="ph" x="34" y="82">Terraform</text>
  <text class="phs" x="110" y="82">four modules, and every edge is reuse</text>

  <rect class="root" x="30" y="92" width="195" height="38"/>
  <text class="nm" x="40" y="109">00-management-groups</text>
  <text class="ns" x="40" y="123">no modules, 13 resources inline</text>

  <rect class="root" x="30" y="142" width="195" height="38"/>
  <text class="nm" x="40" y="159">10-policy</text>
  <text class="ns" x="40" y="173">5 module blocks</text>

  <rect class="root" x="30" y="196" width="195" height="38"/>
  <text class="nm" x="40" y="213">20-subscription-placement</text>
  <text class="ns" x="40" y="227">2 module blocks, 3 instances</text>

  <rect class="root" x="30" y="300" width="195" height="38"/>
  <text class="nm" x="40" y="317">25-brownfield-seed</text>
  <text class="ns" x="40" y="331">no modules</text>

  <rect class="root" x="30" y="356" width="195" height="38"/>
  <text class="nm" x="40" y="373">90-optional-network</text>
  <text class="ns" x="40" y="387">2 module blocks</text>

  <rect class="mod" x="265" y="356" width="195" height="38"/>
  <text class="nm" x="275" y="373">spoke-network</text>
  <text class="ns" x="275" y="387">1 caller, 2 spokes, free at rest</text>

  <path class="edge" d="M 225 375 L 261 375" marker-end="url(#a4)"/>
  <text class="el" x="228" y="369">x1</text>

  <path class="edge" d="M 225 361 L 245 361 L 245 212 L 731 212" marker-end="url(#a4)"/>
  <text class="el" x="560" y="208">x1, the connectivity budget</text>

  <rect class="mod" x="265" y="142" width="195" height="38"/>
  <text class="nm" x="275" y="159">policy-assignment</text>
  <text class="ns" x="275" y="173">5 callers</text>

  <rect class="mod" x="265" y="250" width="195" height="38"/>
  <text class="nm" x="275" y="267">subscription-vending</text>
  <text class="ns" x="275" y="281">1 caller, the exception</text>

  <rect class="mod" x="735" y="196" width="195" height="38"/>
  <text class="nm" x="745" y="213">subscription-budget</text>
  <text class="ns" x="745" y="227">3 callers</text>

  <path class="edge" d="M 225 161 L 261 161" marker-end="url(#a4)"/>
  <text class="el" x="228" y="155">x5</text>

  <path class="edge" d="M 225 205 L 731 205" marker-end="url(#a4)"/>
  <text class="el" x="300" y="200">x1, the brownfield budget</text>

  <path class="edge" d="M 225 225 L 245 225 L 245 269 L 261 269" marker-end="url(#a4)"/>
  <text class="el" x="252" y="245">for_each, 4 keys, 2 created</text>

  <path class="edge" d="M 460 269 L 690 269 L 690 222 L 731 222" marker-end="url(#a4)"/>
  <text class="el" x="500" y="264">x1, a module calling a module</text>

  <!-- ================= BICEP ================= -->
  <rect class="panel" x="20" y="444" width="960" height="414"/>
  <text class="ph" x="34" y="466">Bicep</text>
  <text class="phs" x="86" y="466">the same four modules, plus six files that are modules only because a module is how you change scope</text>

  <rect class="root" x="30" y="476" width="195" height="38"/>
  <text class="nm" x="40" y="493">00-management-groups</text>
  <text class="ns" x="40" y="507">no modules, 13 resources inline</text>

  <rect class="root" x="30" y="526" width="195" height="38"/>
  <text class="nm" x="40" y="543">10-policy</text>
  <text class="ns" x="40" y="557">5 declarations</text>

  <rect class="root" x="30" y="580" width="195" height="38"/>
  <text class="nm" x="40" y="597">20-subscription-placement</text>
  <text class="ns" x="40" y="611">3 declarations, 4 instances</text>

  <rect class="root" x="30" y="742" width="195" height="38"/>
  <text class="nm" x="40" y="759">25-brownfield-seed</text>
  <text class="ns" x="40" y="773">1 declaration</text>

  <rect class="mod" x="265" y="526" width="195" height="38"/>
  <text class="nm" x="275" y="543">policy-assignment</text>
  <text class="ns" x="275" y="557">5 callers</text>

  <rect class="mod" x="265" y="634" width="195" height="38"/>
  <text class="nm" x="275" y="651">subscription-vending</text>
  <text class="ns" x="275" y="665">1 caller, the exception</text>

  <rect class="shim" x="500" y="634" width="195" height="38"/>
  <text class="nm" x="510" y="651">vended-subscription</text>
  <text class="ns" x="510" y="665">scope shim, BCP120</text>

  <rect class="shim" x="265" y="688" width="195" height="38"/>
  <text class="nm" x="275" y="705">management-logs</text>
  <text class="ns" x="275" y="719">scope shim, to subscription</text>

  <rect class="shim" x="500" y="688" width="195" height="38"/>
  <text class="nm" x="510" y="705">log-analytics-workspace</text>
  <text class="ns" x="510" y="719">scope shim, to resource group</text>

  <rect class="shim" x="265" y="742" width="195" height="38"/>
  <text class="nm" x="275" y="759">seed-network</text>
  <text class="ns" x="275" y="773">scope shim, to resource group</text>

  <rect class="mod" x="735" y="580" width="195" height="38"/>
  <text class="nm" x="745" y="597">subscription-budget</text>
  <text class="ns" x="745" y="611">2 callers</text>

  <path class="edge" d="M 225 545 L 261 545" marker-end=""/>
  <text class="el" x="228" y="539">x5</text>

  <path class="edge" d="M 225 589 L 731 589" marker-end=""/>
  <text class="el" x="470" y="584">x1, the brownfield budget</text>

  <path class="edge" d="M 225 605 L 245 605 L 245 653 L 261 653" marker-end=""/>
  <text class="el" x="252" y="629">loop, 4 items, conditional</text>

  <path class="edge" d="M 225 613 L 252 613 L 252 707 L 261 707" marker-end=""/>

  <path class="edge" d="M 460 653 L 496 653" marker-end=""/>
  <path class="edge" d="M 695 653 L 715 653 L 715 608 L 731 608" marker-end=""/>
  <text class="el" x="600" y="629">the extra hop</text>

  <path class="edge" d="M 460 707 L 496 707" marker-end=""/>
  <path class="edge" d="M 225 761 L 261 761" marker-end=""/>

  <!-- ===== 90-optional-network ===== -->
  <rect class="root" x="30" y="796" width="195" height="38"/>
  <text class="nm" x="40" y="813">90-optional-network</text>
  <text class="ns" x="40" y="827">3 declarations</text>

  <rect class="shim" x="265" y="796" width="195" height="38"/>
  <text class="nm" x="275" y="813">hub-network</text>
  <text class="ns" x="275" y="827">scope shim, to resource group</text>

  <rect class="shim" x="500" y="796" width="195" height="38"/>
  <text class="nm" x="510" y="813">billable</text>
  <text class="ns" x="510" y="827">scope shim, to resource group</text>

  <rect class="mod" x="735" y="796" width="195" height="38"/>
  <text class="nm" x="745" y="813">spoke-network</text>
  <text class="ns" x="745" y="827">1 caller, free at rest</text>

  <path class="edge" d="M 225 815 L 261 815" marker-end=""/>
  <text class="el" x="230" y="811">x1</text>

  <path class="edge" d="M 225 800 L 243 800 L 243 786 L 715 786 L 715 796" marker-end=""/>
  <text class="el" x="500" y="782">loop, 2 spokes</text>

  <path class="edge" d="M 225 830 L 243 830 L 243 848 L 480 848 L 480 834" marker-end=""/>
  <text class="el" x="280" y="844">x1, the billable devices</text>

  <!-- ================= key ================= -->
  <rect class="root" x="20" y="872" width="26" height="14"/>
  <text class="key" x="54" y="883">root directory</text>
  <rect class="mod" x="150" y="872" width="26" height="14"/>
  <text class="key" x="184" y="883">reusable module, lives in modules/</text>
  <rect class="shim" x="390" y="872" width="26" height="14"/>
  <text class="key" x="424" y="883">scope shim, lives beside its caller</text>

  <text class="note" x="20" y="910">Read the two panels against each other. The blue nodes are the same four in both, which is the point: composition is the same idea in either language. Everything amber is</text>
  <text class="note" x="20" y="926">Bicep needing a nested deployment to cross a scope boundary, so it has one caller by construction and the two caller rule never applies to it.</text>
  <text class="note" x="20" y="946">The graphs differ in two places. The extra hop between vending and budget is the BCP120 workaround rather than reuse. And subscription-budget has three callers in</text>
  <text class="note" x="20" y="962">Terraform against two in Bicep, because terraform/90-optional-network creates a connectivity budget and bicep/90-optional-network does not. That gap is real, not a drawing error.</text>
  <text class="cap" x="20" y="982">Counts are of declarations, not instances: one block under for_each or a loop is one edge on this diagram and several resources at apply time.</text>
</svg>
