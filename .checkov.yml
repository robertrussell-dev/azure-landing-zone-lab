# Checkov configuration.
#
# Every skip needs a justification on the line above it, and is only added
# after a real finding.
#
# Terraform is scanned as written and Bicep as compiled ARM JSON; see
# scripts/scan-security.sh.

framework:
  - terraform
  - arm

# Directories that hold no deployable infrastructure.
skip-path:
  - docs
  - runbooks

skip-check:
  # Defender plans, from modules/subscription-baseline. The free tier is on
  # purpose; paid plans bill per resource. CKV_AZURE_84 and CKV_AZURE_87 also
  # misfire on the CloudPosture pricing resource.
  - CKV_AZURE_19
  - CKV_AZURE_84
  - CKV_AZURE_87
  # Security contact, same module. These read the retired securityContacts
  # schema (alertNotifications, alertsToAdmins). The 2023 API the module uses
  # sets the same things through notificationsSources, alerts of High severity,
  # and notificationsByRole, Owner, which the checks do not recognize.
  - CKV_AZURE_21
  - CKV_AZURE_22
  # Microsoft retired the security contact phone number requirement; its built
  # in policy is marked deprecated.
  - CKV_AZURE_20

# Fail the build on any severity.
compact: true
quiet: true
